[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alfred"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "ane-transformers>=0.1.1",
    "coremltools>=9.0",
    "openai-whisper>=20250625",
    "torch==2.7.0",
    "pywhispercpp @ git+https://github.com/absadiki/pywhispercpp",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "edge-tts>=7.2.7",
    "openai>=1.0.0",
    "soundfile>=0.12.0",
    "python-dotenv>=1.2.1",
    "langchain>=1.2.0",
    "langchain-openai>=1.1.6",
]

[project.scripts]
alfred = "src.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.metadata]
allow-direct-references = true
